name: Bug Report
description: Report something in Mailaxe that doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please search [existing issues](https://github.com/valba8/mailaxe/issues?q=label%3Abug) first. Pull requests with a fix are welcome, with or without an issue.

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - Mac
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x86_64
        - arm64
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Linux Distro and Version
      description: Required if OS is Linux
      placeholder: e.g. Ubuntu 24.04, Fedora 41, Arch

  - type: dropdown
    id: install-method
    attributes:
      label: Install Method
      options:
        - Windows Installer
        - Windows Portable
        - Linux Binary (tar.gz)
        - Compiled from Source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Mailaxe Version
      description: "Find it in Mailaxe at ⚙️ (Settings) → About."
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: dropdown
    id: account-type
    attributes:
      label: Account type (if relevant)
      multiple: true
      options:
        - Gmail (OAuth, own client)
        - Gmail (IMAP + app password)
        - Outlook / Microsoft 365
        - Other IMAP
        - Not account related

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug. If it involves a Mailaxe-specific option (Settings → General), say which ones are turned on.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Screenshots help a lot.
    validations:
      required: true

  - type: dropdown
    id: upstream
    attributes:
      label: Does it also happen in the official Aerion app?
      options:
        - "I don't know"
        - "Yes"
        - "No, only in Mailaxe"
