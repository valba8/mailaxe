name: Release

# Mailaxe release workflow (replaces Aerion's, which also publishes Flatpak,
# AUR and signed macOS builds tied to the upstream project).
#
# Push a tag like v0.3.6-mailaxe.1 to build Windows and Linux binaries and
# attach them to a DRAFT GitHub release for review before publishing.
# Builds carry no OAuth credentials: users bring their own (see README).

on:
  push:
    tags: 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Wails finds NSIS via exec.LookPath("makensis")
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          wails build -clean -nsis -platform windows/amd64
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item build/bin/mailaxe.exe dist/Mailaxe-windows-amd64.exe
          Move-Item build/bin/mailaxe-amd64-installer.exe dist/Mailaxe-windows-setup-amd64.exe

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          wails build -clean -platform linux/amd64 -tags webkit2_41,linux,production
          mkdir -p dist package
          cp build/bin/mailaxe package/mailaxe
          cp LICENSE NOTICE README.md package/
          tar czf dist/mailaxe-linux-amd64.tar.gz -C package .

      - uses: actions/upload-artifact@v7
        with:
          name: mailaxe-${{ matrix.platform }}
          path: dist/*
          retention-days: 1

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        run: |
          TAG=${{ github.ref_name }}
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --prerelease --generate-notes \
              --title "Mailaxe $TAG" \
              --notes "Unofficial fork of Aerion. Builds ship without OAuth credentials: see the README for Gmail/Outlook setup."
          gh release upload "$TAG" artifacts/* --clobber
